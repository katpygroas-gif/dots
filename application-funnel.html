<script>
const QUESTIONS = [
  { key:'role', question:"Are you the owner?", options:["Yes","No"] },
  { key:'revenue', question:"What's your average monthly revenue?", options:["Under $20k","$20k\u2013$50k","$50k\u2013$100k","$100k+"] },
  { key:'jobsPerWeek', question:"How many jobs do you get a week?", options:["Under 5","5\u201310","10\u201320","20+"] },
  { key:'painPoint', question:"What's your biggest bottleneck to scaling your restoration company?", options:["Missed calls","Wasting ad spend to get low ROI","No system for bringing in leads","Not enough referral flow from plumbers, HVAC, electricians","Insurance claim delays","Not sure, just overwhelmed"] }
];
const TOTAL_STEPS = QUESTIONS.length + 1;

let step = 0;
const answers = {};
const contact = { name:'', phone:'', phoneCode:'', country:'', email:'' };
let submitted = false;
let phoneConfirmed = false;
let lastConfirmedSignature = '';

const card = document.getElementById('card');
const topRow = document.getElementById('topRow');
const progressTrack = document.getElementById('progressTrack');
const progressFill = document.getElementById('progressFill');
const stepLabel = document.getElementById('stepLabel');
const backBtn = document.getElementById('backBtn');
const questionArea = document.getElementById('questionArea');
const contactForm = document.getElementById('contactForm');
const confirmStep = document.getElementById('confirmStep');

backBtn.addEventListener('click', () => {
  if(step > 0){
    step -= 1;
    render();
  }
});

function selectOption(key, value, btnEl){
  answers[key] = value;
  const siblings = btnEl.parentElement.querySelectorAll('.option-btn');
  siblings.forEach(b => b.classList.remove('selected'));
  btnEl.classList.add('selected');
  setTimeout(() => {
    step = Math.min(step + 1, TOTAL_STEPS - 1);
    render();
  }, 220);
}

function renderQuestionStep(){
  const q = QUESTIONS[step];
  const optionsHtml = q.options.map(opt => {
    const selected = answers[q.key] === opt ? 'selected' : '';
    return `<button type="button" class="option-btn ${selected}" data-value="${opt}">${opt}</button>`;
  }).join('');
  questionArea.innerHTML = `
    <h2 class="question">${q.question}</h2>
    <div class="options">${optionsHtml}</div>
  `;
  questionArea.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => selectOption(q.key, btn.dataset.value, btn));
  });
}

function normalizeCode(raw){
  return (raw || '').trim().replace(/\s+/g, '');
}

function isValidCodeFormat(raw){
  const c = normalizeCode(raw);
  return /^\+[1-9]\d{0,3}$/.test(c);
}

function digitsOnly(raw){
  return (raw || '').replace(/\D/g, '');
}

function phoneFormatError(raw, codeRaw){
  const trimmed = (raw || '').trim();
  if(!trimmed) return 'Enter a phone number';

  // letters or symbols other than digits/spaces/()-. aren't allowed
  if(!/^[\d\s().-]+$/.test(trimmed)) return 'Numbers only, please (no letters or symbols)';

  // a '+' means someone tried to put a country code in the number field
  if(trimmed.includes('+')) return "Don't include the country code here, just the number";

  const digits = digitsOnly(trimmed);

  const codeDigits = digitsOnly(codeRaw);
  if(codeDigits && digits.length > codeDigits.length && digits.startsWith(codeDigits) && (digits.length - codeDigits.length) >= 6){
    return "Looks like the country code is in here too, please remove it";
  }

  if(digits.length < 7) return "That number's too short, check the digits";
  if(digits.length > 10) return "That number's too long, check the digits";
  if(/^(\d)\1+$/.test(digits)) return "That doesn't look like a real number";
  if(codeDigits && (codeDigits.length + digits.length) > 15) return "That doesn't look like a real number";

  return '';
}

function isValidPhoneFormat(raw, codeRaw){
  return phoneFormatError(raw, codeRaw) === '';
}

function signatureFor(code, phone){
  return normalizeCode(code) + '|' + digitsOnly(phone);
}

function formatDisplayNumber(){
  return `${contact.phoneCode} ${contact.phone}`.trim();
}

function validateContact({ requireConfirm } = { requireConfirm: true }){
  let valid = true;
  document.getElementById('errName').textContent = '';
  document.getElementById('errPhone').textContent = '';
  document.getElementById('errEmail').textContent = '';
  document.getElementById('fPhoneCode').classList.remove('bad');
  document.getElementById('fPhone').classList.remove('bad');

  if(!contact.name.trim()){
    document.getElementById('errName').textContent = 'Enter your name';
    valid = false;
  }

  const codeOk = isValidCodeFormat(contact.phoneCode);
  const phoneErr = phoneFormatError(contact.phone, contact.phoneCode);

  if(!contact.phoneCode.trim()){
    document.getElementById('errPhone').textContent = 'Enter a country code';
    document.getElementById('fPhoneCode').classList.add('bad');
    valid = false;
  } else if(!codeOk){
    document.getElementById('errPhone').textContent = "That country code doesn't look right (e.g. +1, +44, +61)";
    document.getElementById('fPhoneCode').classList.add('bad');
    valid = false;
  } else if(phoneErr){
    document.getElementById('errPhone').textContent = phoneErr;
    document.getElementById('fPhone').classList.add('bad');
    valid = false;
  }

  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!contact.email.trim()){
    document.getElementById('errEmail').textContent = 'Enter your email';
    valid = false;
  } else if(!emailRe.test(contact.email.trim())){
    document.getElementById('errEmail').textContent = 'Enter a valid email';
    valid = false;
  }

  if(valid && requireConfirm){
    const sig = signatureFor(contact.phoneCode, contact.phone);
    if(!phoneConfirmed || sig !== lastConfirmedSignature){
      document.getElementById('errPhone').textContent = '';
      showPhoneConfirm();
      valid = false;
    }
  }

  return valid;
}

const phoneConfirmBox = document.getElementById('phoneConfirm');
const pcNumber = document.getElementById('pcNumber');
const pcYes = document.getElementById('pcYes');
const pcNo = document.getElementById('pcNo');

function showPhoneConfirm(){
  pcNumber.textContent = formatDisplayNumber();
  pcYes.classList.remove('selected');
  pcNo.classList.remove('selected');
  phoneConfirmBox.classList.add('show');
  phoneConfirmBox.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function hidePhoneConfirm(){
  phoneConfirmBox.classList.remove('show');
}

pcYes.addEventListener('click', () => {
  pcYes.classList.add('selected');
  pcNo.classList.remove('selected');
  phoneConfirmed = true;
  lastConfirmedSignature = signatureFor(contact.phoneCode, contact.phone);
  setTimeout(() => {
    hidePhoneConfirm();
    contactForm.requestSubmit();
  }, 180);
});

pcNo.addEventListener('click', () => {
  pcNo.classList.add('selected');
  pcYes.classList.remove('selected');
  phoneConfirmed = false;
  hidePhoneConfirm();
  document.getElementById('fPhone').focus();
  document.getElementById('fPhone').select();
});

function invalidatePhoneConfirmation(){
  phoneConfirmed = false;
  hidePhoneConfirm();
}

  { name:"Thailand", code:"+66", flag:"🇹🇭" },
  { name:"UAE", code:"+971", flag:"🇦🇪" },
  { name:"Vietnam", code:"+84", flag:"🇻🇳" }
];

const phoneCodeInput = document.getElementById('fPhoneCode');
const codeFlag = document.getElementById('codeFlag');
const codeDropdown = document.getElementById('codeDropdown');
const codeWrap = document.getElementById('codeWrap');
const countryNameInput = document.getElementById('fCountryName');
const phoneInput = document.getElementById('fPhone');

contact.phoneCode = '+1';
contact.country = 'United States';
phoneCodeInput.value = '+1';
codeFlag.textContent = '🇺🇸';
countryNameInput.value = 'United States';

function findFlagForCode(raw){
  const typed = normalizeCode(raw);
  if(!typed || typed === '+') return '🌐';
  const exact = COUNTRY_CODES.find(c => c.code === typed);
  if(exact) return exact.flag;
  const partial = COUNTRY_CODES.find(c => c.code.startsWith(typed) || typed.startsWith(c.code));
  return partial ? partial.flag : '🌐';
}

function renderDropdown(filterText){
  const q = (filterText || '').trim().toLowerCase().replace(/^\+/, '');
  const priority = COUNTRY_CODES.filter(c => c.priority);
  const rest = COUNTRY_CODES.filter(c => !c.priority);

  const matches = list => list.filter(c => {
    if(!q) return true;
    return c.name.toLowerCase().includes(q) || c.code.replace('+','').includes(q);
  });

  const priorityMatches = matches(priority);
  const restMatches = matches(rest);

  let html = '';
  if(priorityMatches.length){
    html += `<div class="code-group-label">Top Markets</div>`;
    priorityMatches.forEach(c => {
      html += `<div class="code-option" data-code="${c.code}" data-flag="${c.flag}" data-name="${c.name}">
        <span class="co-flag">${c.flag}</span>
        <span class="co-name">${c.name}</span>
        <span class="co-code">${c.code}</span>
      </div>`;
    });
  }
  if(restMatches.length){
    html += `<div class="code-group-label">Other Countries</div>`;
    restMatches.forEach(c => {
      html += `<div class="code-option" data-code="${c.code}" data-flag="${c.flag}" data-name="${c.name}">
        <span class="co-flag">${c.flag}</span>
        <span class="co-name">${c.name}</span>
        <span class="co-code">${c.code}</span>
      </div>`;
    });
  }
  if(!priorityMatches.length && !restMatches.length){
    html = `<div class="code-empty">No match — your typed code will still be used</div>`;
  }
  codeDropdown.innerHTML = html;

  codeDropdown.querySelectorAll('.code-option').forEach(opt => {
    opt.addEventListener('click', () => {
      const code = opt.dataset.code;
      const flag = opt.dataset.flag;
      const name = opt.dataset.name;
      phoneCodeInput.value = code;
      contact.phoneCode = code;
      contact.country = name;
      countryNameInput.value = name;
      codeFlag.textContent = flag;
      phoneCodeInput.classList.remove('bad');
      document.getElementById('errPhone').textContent = '';
      invalidatePhoneConfirmation();
      closeDropdown();
    });
  });
}

function openDropdown(){
  renderDropdown(phoneCodeInput.value);
  codeDropdown.classList.add('open');
}
function closeDropdown(){
  codeDropdown.classList.remove('open');
}

phoneCodeInput.addEventListener('focus', openDropdown);
phoneCodeInput.addEventListener('click', openDropdown);

phoneCodeInput.addEventListener('input', e => {
  const raw = e.target.value;
  contact.phoneCode = raw;
  invalidatePhoneConfirmation();
  const typed = normalizeCode(raw);
  const exact = COUNTRY_CODES.find(c => c.code === typed);
  if(exact){
    contact.country = exact.name;
    countryNameInput.value = exact.name;
    codeFlag.textContent = exact.flag;
  } else {
    contact.country = 'Manual entry';
    countryNameInput.value = 'Manual entry';
    codeFlag.textContent = findFlagForCode(raw);
  }
  renderDropdown(raw);
  codeDropdown.classList.add('open');
});

document.addEventListener('click', e => {
  if(!codeWrap.contains(e.target)){
    closeDropdown();
  }
});

document.getElementById('fName').addEventListener('input', e => contact.name = e.target.value);
phoneInput.addEventListener('input', e => {
  contact.phone = e.target.value;
  invalidatePhoneConfirmation();
  phoneInput.classList.remove('bad');
  document.getElementById('errPhone').textContent = '';
});
document.getElementById('fEmail').addEventListener('input', e => contact.email = e.target.value);

contactForm.addEventListener('submit', async e => {
  e.preventDefault();
  if(!validateContact()) return;

  const payload = {
    ...answers,
    ...contact,
    phone: `${contact.phoneCode} ${contact.phone}`.trim(),
    country: contact.country
  };
  const submitBtn = document.getElementById('submitBtn');
  const errSubmit = document.getElementById('errSubmit');
  errSubmit.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting...';

  try {
    const res = await fetch('https://formspree.io/f/mqerzjvb', {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if(!res.ok){
      throw new Error('Submission failed');
    }

    if (typeof fbq === 'function') {
      const eventId = crypto.randomUUID();
      fbq('track', 'Lead', {
        em: contact.email.trim().toLowerCase(),
        ph: (contact.phoneCode + contact.phone).replace(/\D/g, ''),
        fn: contact.name.trim().toLowerCase()
      }, { eventID: eventId });
    }

    submitted = true;
    render();
  } catch (err) {
    errSubmit.textContent = "Something went wrong sending your application. Please try again.";
    submitBtn.disabled = false;
    submitBtn.textContent = 'Apply Now';
  }
});

function render(){
  const isQuestionStep = step < QUESTIONS.length;
  const isContactStep = step === QUESTIONS.length && !submitted;

  questionArea.style.display = (!submitted && isQuestionStep) ? 'block' : 'none';
  contactForm.classList.toggle('active', isContactStep);
  confirmStep.classList.toggle('active', submitted);

  topRow.style.display = submitted ? 'none' : 'flex';
  progressTrack.style.display = submitted ? 'none' : 'block';

  if(!submitted){
    backBtn.classList.toggle('show', step > 0);
    stepLabel.textContent = `Step ${step + 1} of ${TOTAL_STEPS}`;
    const pct = Math.round(((step + 1) / TOTAL_STEPS) * 100);
    progressFill.style.width = pct + '%';
    progressFill.classList.remove('flash');
    void progressFill.offsetWidth;
    progressFill.classList.add('flash');
  }

  if(isQuestionStep && !submitted){
    renderQuestionStep();
  }
}

render();
</script>

</body>
</html>
